# ------------------------------------------------------------
# Default settings for the tests.
# Any value here can be overridden on the command line with -D, e.g.
#   mvn clean test -Dplatform=ios -DrunOn=browserstack
#   mvn clean test -Dandroid.bs.device="Samsung Galaxy S23" -Dandroid.bs.osVersion=13.0
#
# Secrets (BrowserStack username, access key, bs:// app IDs) do NOT go here.
# They stay in environment variables or .env, so they never reach Git.
# ------------------------------------------------------------

# What to run: android or ios
platform=android

# Where to run: local or browserstack
runOn=local

# Local Appium server
appium.url=http://127.0.0.1:4723

# ---------- Android, local (phone or emulator) ----------
# Leave udid empty if only one device is connected (check with: adb devices)
android.local.udid=
android.local.app=apidemorelease.apk

# ---------- Android, BrowserStack ----------
android.bs.device=Google Pixel 7
android.bs.osVersion=13.0

# ---------- iOS, local (Mac only: simulator or real iPhone) ----------
ios.local.device=iPhone 15
ios.local.osVersion=
# udid only needed for a real iPhone
ios.local.udid=
ios.local.app=MyApp.app

# ---------- iOS, BrowserStack ----------
ios.bs.device=iPhone 15
ios.bs.osVersion=17

# ---------- BrowserStack dashboard names ----------
bs.projectName=Appium Demo
bs.buildName=appium-demo-build
